<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kalkulator BPM</title>
<style>
  html,body{margin:0;height:100%;background:#111;font-family:monospace;color:#0ff;overflow:hidden}
  #app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column}
  #timer{font-size:6rem;font-weight:bold;margin-bottom:1rem}
  #bpm{font-size:8rem;font-weight:bold}
  #start{position:relative;width:200px;height:200px;border-radius:50%;background:#0ff;color:#111;font-size:3rem;border:none;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
  #start:active{transform:scale(.9);background:#0affff}
  .pulse{position:absolute;top:50%;left:50%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at center,#0ff,transparent);animation:pulse 0.8s infinite;pointer-events:none}
  @keyframes pulse{0%{transform:scale(1);opacity:0.9}50%{transform:scale(1.3);opacity:0}100%{transform:scale(1);opacity:0}}
  @-webkit-keyframes pulse{0%{transform:scale(1);opacity:0.9}50%{transform:scale(1.3);opacity:0}100%{transform:scale(1);opacity:0}}
  .red{background:#f00 !important}
</style>
</head>
<body>
<div id="app">
  <div id="timer">00:00</div>
  <div id="bpm">--- BPM</div>
  <button id="start">START</button>
</div>
<script>
const startBtn=document.getElementById('start');
const timerEl=document.getElementById('timer');
const bpmEl=document.getElementById('bpm');
let startTime; let running=false; let taps=[];
let timerInterval;
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function playTick(){const osc=audioCtx.createOscillator();osc.frequency.value=1000;osc.type='square';osc.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.05);}
function updateTimer(){const elapsed=Math.floor((Date.now()-startTime)/1000); timerEl.textContent=((elapsed/60)|0).toString().padStart(2,'0')+':'+(elapsed%60).toString().padStart(2,'0');}
function calcBPM(){if(taps.length<2)return;const diffs=taps.slice(1).map((t,i)=>t-taps[i]);const avg=Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);const bpm=60000/avg; bpmEl.textContent=Math.round(bpm)+' BPM'; if(bpm>240){bpmEl.classList.add('red');}else{bpmEl.classList.remove('red');}}
startBtn.addEventListener('click',()=>{
  if(!running){running=true; startBtn.textContent='STOP'; startTime=Date.now(); timerInterval=setInterval(updateTimer,1000); taps=[]; bpmEl.textContent='--- BPM'; startBtn.classList.remove('red');}
  else{running=false; startBtn.textContent='START'; clearInterval(timerInterval); startTime=null;}
});
startBtn.addEventListener('mousedown',()=>{if(!running)return; const now=Date.now(); taps.push(now); playTick(); navigator.vibrate?.(40); calcBPM();
  const pulse=document.createElement('div'); pulse.className='pulse'; startBtn.appendChild(pulse); setTimeout(()=>pulse.remove(),800);});
</script>
</body>
</html>
